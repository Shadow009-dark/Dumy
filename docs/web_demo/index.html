<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DUMY — demo chat</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 1.4rem; }
  label { display: block; margin: 12px 0 4px; font-size: .9rem; }
  input, textarea, button { width: 100%; box-sizing: border-box; padding: 10px; font: inherit; }
  textarea { min-height: 90px; resize: vertical; }
  button { margin-top: 10px; cursor: pointer; }
  #out { white-space: pre-wrap; margin-top: 18px; padding: 14px; border: 1px solid #8884; border-radius: 8px; min-height: 60px; }
  #meta { font-size: .8rem; opacity: .7; margin-top: 6px; }
  .hint { font-size: .8rem; opacity: .75; }
</style>
</head>
<body>
<h1>DUMY demo</h1>
<p class="hint">API açarı yalnız yaddaşda saxlanılır. Bu səhifəni API ilə eyni
origin-də yerləşdirin və ya origin-i <code>config.json → allowed_origins</code>
siyahısına əlavə edin.</p>

<label for="endpoint">API ünvanı</label>
<input id="endpoint" value="http://127.0.0.1:8085/chat">

<label for="key">X-API-Key (config-də boşdursa, boş buraxın)</label>
<input id="key" type="password" autocomplete="off" placeholder="API açarı">

<label for="q">Sual</label>
<textarea id="q" placeholder="Məsələn: 120 baş, gündə 25 kq, 30 gün üçün nə qədər yem lazımdır?"></textarea>
<button id="send">Göndər</button>

<div id="out" aria-live="polite"></div>
<div id="meta"></div>

<script>
  const $ = (id) => document.getElementById(id);
  let session = "demo-" + Math.random().toString(36).slice(2);

  async function ask() {
    const question = $("q").value.trim();
    if (!question) return;
    $("out").textContent = "Gözləyin…";
    $("meta").textContent = "";
    const t0 = performance.now();
    try {
      const res = await fetch($("endpoint").value.trim(), {
        method: "POST",
        headers: {
          "Content-Type": "application/json; charset=utf-8",
          ...($("key").value ? { "X-API-Key": $("key").value } : {})
        },
        body: JSON.stringify({ session_id: session, message: question })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        $("out").textContent = "Xəta: " + (data.error || ("HTTP " + res.status));
      } else {
        $("out").textContent = data.answer || "(boş cavab)";
        const src = (data.sources || []).map(s => s.label || s.source).join(", ");
        $("meta").textContent =
          `növ: ${data.qtype || "-"} · ${((performance.now() - t0) / 1000).toFixed(1)} s` +
          (src ? ` · mənbə: ${src}` : "") +
          (data.web_used ? " · internet" : "");
      }
    } catch (e) {
      $("out").textContent =
        "Şəbəkə xətası: " + e.message + " (CORS origin-i allowed_origins-ə əlavə edin)";
    }
  }

  $("send").addEventListener("click", ask);
  $("q").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) ask();
  });
</script>
</body>
</html>
